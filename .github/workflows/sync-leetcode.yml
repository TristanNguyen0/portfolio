name: Refresh LeetCode fallback snapshot

# The Worker's cron trigger is what keeps the site current now; this only
# refreshes src/data/leetcode.json, the build-time snapshot the page paints
# before /api/leetcode answers. Manual because a stale fallback is visible for
# milliseconds at most -- it is not worth a daily commit.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the Deploy workflow after pushing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync-leetcode.mjs
      # Requires github-actions[bot] in the bypass list of the main ruleset --
      # required status checks otherwise reject this push.
      - name: Commit and deploy if stats changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/leetcode.json; then
            echo "No new solves."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync LeetCode stats"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger the push-based Deploy
          # workflow (GitHub's recursion guard), so dispatch it explicitly.
          gh workflow run deploy.yml --ref main
