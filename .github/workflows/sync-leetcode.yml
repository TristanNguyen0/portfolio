name: Sync LeetCode

on:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC (off the hour to dodge the GitHub cron rush)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the Deploy workflow after pushing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-leetcode.mjs
      - name: Commit and deploy if stats changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/leetcode.json; then
            echo "No new solves."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync LeetCode stats"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger the push-based Deploy
          # workflow (GitHub's recursion guard), so dispatch it explicitly.
          gh workflow run deploy.yml --ref main
